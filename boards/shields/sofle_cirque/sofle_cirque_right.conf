# =====================================================================
# TRACKPAD-ONLY VERIFICATION BUILD
#
# DYA Studio / RPC / 持久化相关功能暂时全部关闭，目的是让 cirque.dtsi 成为
# 唯一真源，排除 NVS 旧值干扰。验证完触控板功能后，把下面带
# "[trackpad-verify] disabled" 的行逐段恢复即可。
#
# 同时 build.yaml 里右半的 studio-rpc-usb-uart snippet 和
# -DCONFIG_ZMK_STUDIO=y 也必须去掉，否则 cmake 参数会强制打开 Studio。
# =====================================================================

CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

# Debug logs
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_INPUT_LOG_LEVEL_WRN=y

# [trackpad-verify] disabled: devtool 日志需要通过 DYA Studio 查看
# # Devtool (firmware log capture)
# CONFIG_ZMK_DEVTOOL=y
# CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
# CONFIG_ZMK_DEVTOOL_LOG_CAPTURE=y

CONFIG_ZMK_POINTING=y

CONFIG_ZMK_SLEEP=y

# === [trackpad-verify] disabled: DYA Studio ===
# # === Studio (Central only) ===
# CONFIG_ZMK_STUDIO=y

# === Cirque Pinnacle Trackpad (SPI, Central only) ===
CONFIG_ZMK_CIRQUE=y
# [trackpad-verify] disabled: Cirque Studio RPC（实时调参页面）
# CONFIG_ZMK_CIRQUE_STUDIO_RPC=y

# [trackpad-verify] disabled: BLE 管理（仅 Studio 页面用）
# CONFIG_ZMK_BLE_MANAGEMENT=y
# CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# [trackpad-verify] disabled: Settings RPC（仅 Studio 页面用）
# # === Settings RPC (Central only) ===
# CONFIG_ZMK_SETTINGS_RPC=y
# CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# [trackpad-verify] disabled: 自定义设置持久化 —— 关掉后 cirque.dtsi 不再被 NVS 覆盖
# # === Custom Settings ===
# CONFIG_ZMK_CUSTOM_SETTINGS=y
# CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
# CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# === Fast Keymap ===
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y
CONFIG_ZMK_FAST_KEYMAP=y
# [trackpad-verify] disabled: Studio RPC
# CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# [trackpad-verify] disabled: 诊断功能（仅 Studio 页面用）
# # === Diagnostics: Device Info ===
# CONFIG_ZMK_DEVICE_INFO=y
# CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
# # === Diagnostics: Watchdog ===
# CONFIG_ZMK_WATCHDOG=y
# CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# === Runtime Sensor Rotate (Encoder, Central only) ===
# 键位里用到了 &rsr_vol，功能本身必须保留，只关 Studio RPC
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
# [trackpad-verify] disabled: Studio RPC
# CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# === Settings (Central only) ===
CONFIG_SETTINGS=y

# === Battery (Central only) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n

# === Split (Central only) ===
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# === Stack/buffer values ===
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
# [trackpad-verify] disabled: Studio RPC buffers
# CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
# CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=384
# CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# [trackpad-verify] disabled: Runtime Macro / Combo
# 这两个 Kconfig 会 "select ZMK_CUSTOM_SETTINGS"，不关掉持久化就关不掉
# # === Runtime Macro / Combo ===
# CONFIG_ZMK_RUNTIME_MACRO=y
# CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# CONFIG_ZMK_RUNTIME_COMBO=y
# CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
