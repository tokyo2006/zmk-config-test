CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_SLEEP=y

CONFIG_ZMK_POINTING=y

# [trackpad-verify] disabled: 自定义设置 relay（仅 Studio 用）
# Custom Settings relay so the central can read/write settings on this peripheral.
# CONFIG_ZMK_CUSTOM_SETTINGS=y
# CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# === Battery (Peripheral) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30
# [trackpad-verify] disabled: Settings RPC（仅 Studio 用）
# CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
