# Bare dev-board joystick test: no matrix, no trackpad, no RGB, no sleep.

CONFIG_ZMK_POINTING=y
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

CONFIG_ZMK_PSP_JOYSTICK=y
CONFIG_ZMK_PSP_JOYSTICK_STUDIO_RPC=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_SLEEP=n

# Keep the switched VCC rail (P0.13) on for the joystick potentiometers.
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# Keep the workqueue free of per-sample debug logging.
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_INPUT_LOG_LEVEL_WRN=y
